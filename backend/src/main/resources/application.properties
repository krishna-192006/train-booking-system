spring.application.name=backend
server.port=8080

# Database Configuration (MySQL by default, auto-fallback to H2 if MySQL password or server fails)
spring.datasource.url=jdbc:mysql://localhost:3306/train_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=9a2f8c4e6b0d1e3f5a7c9b8d6e4f2a0c1b3d5e7f9a8b6c4d2e0f1a3b5c7d9e8f
app.jwt.expiration-ms=86400000

# H2 Console (for debugging/testing fallback)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

